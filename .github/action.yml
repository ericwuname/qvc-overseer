name: "QVC Code Review"
description: "AI Agent blind spot detector — find bugs your AI missed"
author: "QVC Project"

inputs:
  path:
    description: "Path to scan"
    required: false
    default: "."
  min_severity:
    description: "Minimum severity (fatal/severe/moderate/minor)"
    required: false
    default: "severe"
  fail_on_fatal:
    description: "Fail workflow if fatal bugs found"
    required: false
    default: "true"
  auto_pr:
    description: "Create auto-PR with fix suggestions for high-confidence bugs"
    required: false
    default: "true"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install QVC
      shell: bash
      run: pip install qvc-overseer

    - name: Run QVC Scan
      id: qvc-scan
      shell: bash
      run: |
        python -m qvc.cli scan ${{ inputs.path }} --full --min-severity ${{ inputs.min_severity }} --format json --output qvc-report.json
        echo "SCAN_DONE=true" >> $GITHUB_ENV

    - name: Generate Fix Suggestions
      if: inputs.auto_pr == 'true' && env.SCAN_DONE == 'true'
      shell: bash
      env:
        QVC_SCAN_RESULT: qvc-report.json
        QVC_MIN_CONFIDENCE: "0.90"
      run: |
        python -c "
import json, os
from pathlib import Path
bugs = []
try:
    with open('qvc-report.json') as f:
        data = json.load(f)
    items = data if isinstance(data, list) else data.get('bugs', [])
    bugs = [b for b in items if b.get('confidence', 0) >= 0.90]
except: pass
if bugs:
    fatal = sum(1 for b in bugs if b.get('severity') == 'fatal')
    severe = sum(1 for b in bugs if b.get('severity') == 'severe')
    print(f'Found {len(bugs)} high-confidence bugs ({fatal} fatal, {severe} severe)')
    with open('qvc-pr-summary.md', 'w') as f:
        f.write(f'## QVC External Review Results
')
        f.write(f'Found **{len(bugs)}** high-confidence bugs:
')
        for b in bugs[:15]:
            sev = b.get('severity', 'unknown')
            emoji = ':red_circle:' if sev == 'fatal' else ':orange_circle:' if sev == 'severe' else ':yellow_circle:'
            f.write(f'- {emoji} **{b.get(\"title\", \"\")}** — `{b.get(\"file_path\", \"\")}:{b.get(\"line_start\", \"?\")}` ({b.get(\"confidence\", 0):.0%})
')
            if b.get('fix_suggestion'):
                f.write(f'  > Fix: {b.get(\"fix_suggestion\", \"\")[:200]}
')
        f.write(f'

*Generated by [QVC](https://github.com/ericwuname/qvc-overseer) — external overseer, never modifies code.*
')
    print('qvc-pr-summary.md written')
else:
    print('No high-confidence bugs to report')
"

    - name: Post results as PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require("fs");
          const summary = fs.existsSync("qvc-pr-summary.md") 
            ? fs.readFileSync("qvc-pr-summary.md", "utf8") 
            : "QVC scan complete — no high-confidence issues found.";
          await github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: summary
          });

    - name: Upload Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: qvc-report
        path: |
          qvc-report.md
          qvc-report.json
          qvc-pr-summary.md

    - name: Check for fatal bugs
      if: inputs.fail_on_fatal == 'true'
      shell: bash
      run: |
        if [ -f qvc-report.json ]; then
          FATAL_COUNT=$(python -c "import json; d=json.load(open('qvc-report.json')); items=d if isinstance(d,list) else d.get('bugs',[]); print(sum(1 for i in items if i.get('severity')=='fatal')))"
          if [ "$FATAL_COUNT" -gt 0 ]; then
            echo "QVC found $FATAL_COUNT fatal bugs"
            exit 1
          fi
        fi

branding:
  icon: "shield"
  color: "green"
