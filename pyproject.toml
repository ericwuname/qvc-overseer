[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "qvc-overseer"
version = "0.9.0"
description = "QVC - AI Agent code quality external overseer. Review only, never modify."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "QVC Team"}
]
keywords = ["code-review", "ai-agent", "static-analysis", "bug-detection", "quality-assurance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ericwuname/qvc-overseer"
Repository = "https://github.com/ericwuname/qvc-overseer"

[project.scripts]
qvc = "qvc.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["qvc"]
